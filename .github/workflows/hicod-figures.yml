name: HiCoD licensed figure cache
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'hicod/concept_visuals.json'
      - 'hicod/literature/cache_figures.py'
      - '.github/workflows/hicod-figures.yml'
permissions:
  contents: write
concurrency:
  group: hicod-figures
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow PyMuPDF
      - run: python hicod/literature/cache_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: hicod-literature-figures
          path: |
            hicod/literature/*.gif
            hicod/literature/*.png
            hicod/literature/cache_status.json
      - name: Publish licensed assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- hicod/literature
          if ! git diff --cached --quiet; then git commit -m 'Cache licensed HiCoD literature figures and retrieval provenance'; git pull --rebase origin master; git push origin HEAD:master; fi
